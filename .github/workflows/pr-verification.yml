name: PR Verification

on:
  pull_request:
    branches:
      - '**'  # Trigger on PRs to any branch

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campuseats_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: campuseats.client/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET API
        run: dotnet build CampusEats.Api/CampusEats.Api.csproj --configuration Release --no-restore

      - name: Run .NET Tests
        run: dotnet test CampusEats.Test/CampusEats.Test.csproj --configuration Release --no-restore --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=campuseats_db;Username=postgres;Password=password"

      - name: Install client dependencies
        working-directory: campuseats.client
        run: npm ci

      - name: Build React Client
        working-directory: campuseats.client
        run: npm run build

      - name: Run Client Tests
        working-directory: campuseats.client
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Docker Build Verification
        run: |
          echo "Verifying Docker builds..."
          docker build -t campuseats-api -f Dockerfile .
          docker build -t campuseats-client -f Dockerfile.client .
          echo "✓ All Docker images built successfully"

      - name: Summary
        if: success()
        run: |
          echo "✓ .NET API builds successfully"
          echo "✓ .NET tests pass"
          echo "✓ React client builds successfully"
          echo "✓ React client tests pass"
          echo "✓ Docker images build successfully"
          echo ""
          echo "All verification checks passed!"
