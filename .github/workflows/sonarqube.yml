name: SonarQube Analysis
on:
  push:
    branches: [ master, main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Unified Analysis
    runs-on: windows-latest
    
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner

      # PASUL 1: BEGIN - Configurăm ambele surse și fișierele de coverage
      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet-sonarscanner begin /k:"alexnec29_CampusEats" `
            /o:"alexnec29" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.sources="." `
            /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/dist/**" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml" `
            /d:sonar.javascript.lcov.reportPaths="campuseats.client/coverage/lcov.info"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Application
        run: dotnet build --configuration Release --no-restore

      # PASUL 2: GENERARE COVERAGE BACKEND
      - name: Test Backend
        run: |
          dotnet test --configuration Release --no-build `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=./TestResults/coverage.opencover.xml

      # PASUL 3: GENERARE COVERAGE FRONTEND (Dacă ai teste)
      - name: Test Frontend
        working-directory: campuseats.client
        run: |
          npm install
          npm test -- --watchAll=false --coverage --coverageReporters="lcov"

      # PASUL 4: END - Trimitem totul la SonarCloud
      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"