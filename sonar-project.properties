# SonarQube Project Configuration
sonar.projectKey=alexnec29_CampusEats
sonar.organization=alexnec29

# Project metadata
sonar.projectName=CampusEats
sonar.projectVersion=1.0

# Source code location
sonar.sources=CampusEats.Api,campuseats.client/src
sonar.tests=CampusEats.Test,campuseats.client/src

# Exclude specific files/folders
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.dll,campuseats.client/build/**,**/wwwroot/**,**/Migrations/**

# Test exclusions
sonar.test.inclusions=**/*Tests.cs,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx

# Code coverage paths
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=campuseats.client/coverage/lcov.info

# Language specific settings
sonar.sourceEncoding=UTF-8

# .NET specific
sonar.dotnet.excludeTestProjects=true
